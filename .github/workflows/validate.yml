name: Validate n8n Stack
'on':
  push: null
  pull_request: null
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Validate n8n version policy
      run: |
        python3 -m pip install 'PyYAML==6.0.3'
        python3 scripts/validate-versions.py
    - name: Validate workflow JSON files
      run: |
        find workflows -name '*.json' -print0 | while IFS= read -r -d '' file; do
          jq empty "$file"
        done
    - name: Validate docker compose
      run: |
        cp .env.example .env
        docker compose -f docker-compose.local.yml config >/dev/null
    - name: Shell syntax
      run: bash -n scripts/*.sh
